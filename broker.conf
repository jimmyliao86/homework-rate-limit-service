brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
listenPort = 10911
namesrvAddr = rocketmq-namesrv:9876
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# Docker Desktop for Mac cannot route from the host into the container network,
# so the broker must advertise an address the host can reach. Without this the
# nameserver hands out the container-internal IP and every send fails.
brokerIP1 = 127.0.0.1

# The default is already true; stated explicitly so that the dependency on
# auto-created topics (RATE_LIMIT_EVENTS) is visible at a glance.
autoCreateTopicEnable = true
